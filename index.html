<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대창중학교 스마트 학급 알리미</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase JS SDK (v9 호환 모드) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    @keyframes pulse-red {
      0%, 100% { background-color: #ef4444; }
      50% { background-color: #991b1b; }
    }
    .siren-active {
      animation: pulse-red 0.8s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md p-4 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid font-bold text-2xl fa-school text-yellow-300"></i>
        <h1 class="text-xl font-bold tracking-wide">대창중학교 스마트 알리미</h1>
      </div>

      <!-- Settings & Status -->
      <div class="flex items-center gap-3 text-sm flex-wrap">
        <div class="bg-indigo-800/80 px-3 py-1.5 rounded-lg flex items-center gap-2 border border-indigo-500/30">
          <span class="text-indigo-200"><i class="fa-solid fa-door-open"></i> 교실 선택:</span>
          <select id="classSelect" onchange="changeClassRoom()" class="bg-indigo-900 text-white rounded px-2 py-1 outline-none text-sm font-semibold">
            <option value="1-1">1학년 1반</option>
            <option value="1-2">1학년 2반</option>
            <option value="1-3" selected>1학년 3반</option>
            <option value="2-1">2학년 1반</option>
            <option value="2-2">2학년 2반</option>
            <option value="3-1">3학년 1반</option>
          </select>
        </div>

        <button onclick="toggleTeacherMode()" id="teacherModeBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-user-shield"></i> 교사 모드
        </button>

        <div id="connectionStatus" class="flex items-center gap-2 bg-slate-800/60 px-3 py-1.5 rounded-lg border border-slate-600">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" id="statusDot"></span>
          <span id="statusText" class="text-xs text-emerald-300 font-semibold">실시간 자동연동 중</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto w-full p-4 md:p-6 flex-1 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Left / Main Panel (Classroom Controls & Office Alerts) -->
    <div class="md:col-span-2 space-y-6">

      <!-- Teacher Controls (Visible only in Teacher Mode) -->
      <div id="officeControls" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-indigo-600"></i> 교실 호출 및 학급 관리 (교사 전용)
          </h2>
          <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full" id="teacherClassLabel">1학년 3반 제어 중</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <button onclick="sendSignal('CALL', '교무실에서 선생님을 찾습니다!')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-bell text-xl"></i>
            <span>일반 호출</span>
          </button>
          <button onclick="sendSignal('NOTICE', '전달 사항이 있습니다. 화면을 확인해주세요.')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-bullhorn text-xl"></i>
            <span>공지 전달</span>
          </button>
          <button onclick="sendSignal('EMERGENCY', '🚨 긴급 상황! 교무실로 즉시 연락 바랍니다!')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            <span>긴급 사이렌</span>
          </button>
        </div>
      </div>

      <!-- Mood Tracker Form (Students / Classroom) -->
      <div id="classroomMoodForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-face-smile text-amber-500"></i> 오늘 나의 기분 기록하기
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <button type="button" onclick="selectMood('😃', '기쁨/상쾌', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-3 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😃</span>
            <span class="text-xs font-semibold text-slate-600">기쁨/상쾌</span>
          </button>
          <button type="button" onclick="selectMood('😐', '평범/보통', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-3 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😐</span>
            <span class="text-xs font-semibold text-slate-600">평범/보통</span>
          </button>
          <button type="button" onclick="selectMood('😴', '피곤/지침', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-3 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😴</span>
            <span class="text-xs font-semibold text-slate-600">피곤/지침</span>
          </button>
          <button type="button" onclick="selectMood('😡', '화남/속상', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-3 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😡</span>
            <span class="text-xs font-semibold text-slate-600">화남/속상</span>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <input type="text" id="studentName" placeholder="이름 (예: 홍길동)" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
          <input type="text" id="moodReason" placeholder="이유나 한줄 메모" class="sm:col-span-2 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
        </div>
        <button onclick="submitMood()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-sm">
          선생님께 전달하기
        </button>
      </div>

      <!-- Timetable Component -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-clock text-indigo-600"></i> 오늘의 시간표 (1~8교시)
          </h2>
          <button id="saveTTBtn" onclick="saveTimetable()" class="hidden text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg transition">
            시간표 저장
          </button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center" id="timetableGrid">
          <!-- Timetable cells injected via JS -->
        </div>
      </div>

    </div>

    <!-- Right Panel (Meal & Praise Thermometer & Dashboard) -->
    <div class="space-y-6">

      <!-- Praise Thermometer -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-temperature-full text-red-500"></i> 학급 칭찬 온도계
          </h2>
          <span class="text-xl font-extrabold text-red-500" id="tempVal">75°C</span>
        </div>
        <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
          <div id="tempBar" class="bg-gradient-to-r from-amber-400 to-red-500 h-full rounded-full transition-all duration-500" style="width: 75%;"></div>
        </div>
        <div class="flex justify-between gap-2 pt-1">
          <button onclick="updateTemp(-5)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1 rounded text-xs transition">-5°C</button>
          <button onclick="updateTemp(5)" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1 rounded text-xs transition">+5°C</button>
        </div>
      </div>

      <!-- Meal Menu -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-utensils text-emerald-600"></i> 오늘의 급식 식단
          </h2>
          <button id="saveMealBtn" onclick="saveMeals()" class="hidden text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg transition">
            식단 저장
          </button>
        </div>
        <div id="mealListContainer">
          <ul class="text-sm space-y-2 text-slate-600 font-medium" id="mealList">
            <!-- Meal items injected via JS -->
          </ul>
        </div>
      </div>

      <!-- Office Mood Sync Dashboard -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-users-viewfinder text-indigo-600"></i> 실시간 학생 기분 현황
        </h2>
        <div id="moodList" class="space-y-2 max-h-60 overflow-y-auto text-xs text-slate-500">
          <p class="text-center py-4 text-slate-400">제출된 학생 기분이 없습니다.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Sound/Alert Confirm Modal -->
  <div id="alertModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl border-4 border-red-500">
      <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-3xl animate-bounce">
        <i class="fa-solid fa-bell"></i>
      </div>
      <h3 id="modalTitle" class="text-xl font-bold text-slate-900">교무실 호출!</h3>
      <p id="modalMsg" class="text-sm text-slate-600 font-semibold">선생님, 교무실에서 전달할 내용이 있습니다.</p>
      <button onclick="stopAlertSound()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">
        확인하였습니다 (알람 끄기)
      </button>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------------
    // 1. Firebase 실시간 인프라 초기화 (공용 오픈 클라우드 DB)
    // ------------------------------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://daechang-notifier-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // ------------------------------------------------------------------------
    // 2. 전역 상태 관리 및 변수
    // ------------------------------------------------------------------------
    let currentClass = "1-3";
    let isTeacherMode = false;
    let selectedMoodData = { emoji: '', label: '' };
    let audioCtx = null;
    let alarmInterval = null;
    let currentSignalListener = null;
    let currentDataListener = null;

    const defaultTimetables = {
      "1-1": ["국어", "수학", "영어", "과학", "사회", "체육", "미술", "동아리"],
      "1-2": ["수학", "국어", "과학", "영어", "체육", "사회", "음악", "동아리"],
      "1-3": ["국어", "수학", "영어", "과학", "사회", "체육", "미술", "동아리"],
      "2-1": ["영어", "과학", "국어", "수학", "역사", "기술", "한문", "자율"],
      "2-2": ["과학", "영어", "수학", "국어", "기술", "역사", "중국어", "자율"],
      "3-1": ["수학", "영어", "국어", "사회", "과학", "체육", "도덕", "진로"]
    };

    const defaultMeals = ["친환경 쌀밥", "얼큰 쇠고기 무국", "수제 돈가스 & 소스", "마카로니 콘샐러드", "배추김치 / 샤인머스캣"];

    // ------------------------------------------------------------------------
    // 3. 초기화 및 이벤트 리스너
    // ------------------------------------------------------------------------
    window.onload = () => {
      currentClass = localStorage.getItem('dc_selected_class') || '1-3';
      document.getElementById('classSelect').value = currentClass;
      updateClassLabel();
      initClassFirebaseSync();
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
      toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-sm font-bold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function changeClassRoom() {
      currentClass = document.getElementById('classSelect').value;
      localStorage.setItem('dc_selected_class', currentClass);
      updateClassLabel();
      initClassFirebaseSync();
      showToast(`${currentClass}반 채널로 전환되었습니다.`);
    }

    function updateClassLabel() {
      document.getElementById('teacherClassLabel').innerText = `${currentClass}반 제어 중`;
    }

    function toggleTeacherMode() {
      isTeacherMode = !isTeacherMode;
      const controls = document.getElementById('officeControls');
      const btn = document.getElementById('teacherModeBtn');
      const saveTTBtn = document.getElementById('saveTTBtn');
      const saveMealBtn = document.getElementById('saveMealBtn');

      if (isTeacherMode) {
        controls.classList.remove('hidden');
        saveTTBtn.classList.remove('hidden');
        saveMealBtn.classList.remove('hidden');
        btn.className = "bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-lock"></i> 교사 모드 해제`;
        showToast("교사 모드가 활성화되었습니다.");
      } else {
        controls.classList.add('hidden');
        saveTTBtn.classList.add('hidden');
        saveMealBtn.classList.add('hidden');
        btn.className = "bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-user-shield"></i> 교사 모드`;
        showToast("교사 모드가 종료되었습니다.");
      }
      renderTimetable();
      renderMeals();
    }

    // ------------------------------------------------------------------------
    // 4. Firebase 실시간 학급 데이터 연동 로직
    // ------------------------------------------------------------------------
    function initClassFirebaseSync() {
      // 기존 리스너 해제
      if (currentSignalListener) db.ref(`classes/${currentClass}/signal`).off('value', currentSignalListener);
      if (currentDataListener) db.ref(`classes/${currentClass}/data`).off('value', currentDataListener);

      const classDataRef = db.ref(`classes/${currentClass}/data`);
      const classSignalRef = db.ref(`classes/${currentClass}/signal`);

      // 1) 학급 전체 데이터 연동 (시간표, 급식, 칭찬온도계, 기분 목록)
      currentDataListener = classDataRef.on('value', (snapshot) => {
        const val = snapshot.val() || {};
        
        // 시간표
        window.currentTimetableData = val.timetable || defaultTimetables[currentClass] || defaultTimetables["1-3"];
        renderTimetable();

        // 급식
        window.currentMealsData = val.meals || defaultMeals;
        renderMeals();

        // 칭찬 온도계
        const temp = val.temperature !== undefined ? val.temperature : 75;
        document.getElementById('tempVal').innerText = `${temp}°C`;
        document.getElementById('tempBar').style.width = `${temp}%`;

        // 기분 전달 목록
        renderMoodList(val.moods || []);
      });

      // 2) 실시간 호출 신호 연동
      let isFirstSignalLoad = true;
      currentSignalListener = classSignalRef.on('value', (snapshot) => {
        if (isFirstSignalLoad) {
          isFirstSignalLoad = false;
          return;
        }
        const sig = snapshot.val();
        if (sig && sig.timestamp && (Date.now() - sig.timestamp < 10000)) { // 10초 이내 최신 신호만 수신
          showAlertModal(sig.type, sig.message);
          startAlertSound(sig.type === 'EMERGENCY');
        }
      });
    }

    // 신호 전송 (교무실 -> 교실)
    function sendSignal(type, message) {
      db.ref(`classes/${currentClass}/signal`).set({
        type: type,
        message: message,
        timestamp: Date.now()
      });
      showToast(`${currentClass}반으로 호출 신호를 발송했습니다!`);
    }

    // ------------------------------------------------------------------------
    // 5. 알람 및 경보음 시스템 (Web Audio API)
    // ------------------------------------------------------------------------
    function startAlertSound(isEmergency) {
      if (alarmInterval) clearInterval(alarmInterval);
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const playBeep = () => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = isEmergency ? 'sawtooth' : 'sine';
          osc.frequency.value = isEmergency ? 880 : 587.33;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {}
      };

      playBeep();
      alarmInterval = setInterval(playBeep, isEmergency ? 500 : 800);
    }

    function stopAlertSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      document.getElementById('alertModal').classList.add('hidden');
    }

    function showAlertModal(type, msg) {
      const modal = document.getElementById('alertModal');
      document.getElementById('modalTitle').innerText = type === 'EMERGENCY' ? '🚨 긴급 사이렌 알림!' : '🔔 교무실 호출 알림';
      document.getElementById('modalMsg').innerText = msg;
      modal.classList.remove('hidden');
    }

    // ------------------------------------------------------------------------
    // 6. 학급 기능 UI 렌더링 및 저장 액션
    // ------------------------------------------------------------------------
    // 1) 시간표
    function renderTimetable() {
      const grid = document.getElementById('timetableGrid');
      const list = window.currentTimetableData || defaultTimetables["1-3"];

      grid.innerHTML = list.map((subject, idx) => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex flex-col justify-center items-center">
          <span class="text-xs font-bold text-slate-400 block mb-1">${idx + 1}교시</span>
          ${isTeacherMode 
            ? `<input type="text" value="${subject}" id="tt-${idx}" class="w-full text-center font-bold text-slate-700 bg-white border border-slate-300 rounded px-1 py-0.5 text-sm outline-none focus:border-indigo-500">`
            : `<span class="font-bold text-slate-700">${subject}</span>`
          }
        </div>
      `).join('');
    }

    function saveTimetable() {
      const updated = [];
      for (let i = 0; i < 8; i++) {
        const input = document.getElementById(`tt-${i}`);
        updated.push(input ? input.value.trim() || '공결' : '공결');
      }
      db.ref(`classes/${currentClass}/data/timetable`).set(updated);
      showToast(`${currentClass}반 시간표가 성공적으로 저장되었습니다! ✨`);
    }

    // 2) 급식
    function renderMeals() {
      const container = document.getElementById('mealList');
      const meals = window.currentMealsData || defaultMeals;

      if (isTeacherMode) {
        container.innerHTML = `
          <textarea id="mealInput" class="w-full h-32 p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:border-emerald-500 font-medium" placeholder="줄바꿈으로 급식 메뉴를 작성하세요.">${meals.join('\n')}</textarea>
        `;
      } else {
        container.innerHTML = meals.map(meal => `
          <li class="flex items-center gap-2"><i class="fa-solid fa-check text-xs text-emerald-500"></i> ${meal}</li>
        `).join('');
      }
    }

    function saveMeals() {
      const textarea = document.getElementById('mealInput');
      if (textarea) {
        const mealsArray = textarea.value.split('\n').map(m => m.trim()).filter(m => m.length > 0);
        db.ref(`classes/${currentClass}/data/meals`).set(mealsArray);
        showToast("급식 식단이 성공적으로 저장되었습니다! 🍽️");
      }
    }

    // 3) 칭찬 온도계
    function updateTemp(diff) {
      const valElem = document.getElementById('tempVal');
      let curr = parseInt(valElem.innerText);
      curr = Math.max(0, Math.min(100, curr + diff));
      
      db.ref(`classes/${currentClass}/data/temperature`).set(curr);
      showToast(`칭찬 온도계 설정이 저장되었습니다! 🌡️ (${curr}°C)`);
    }

    // 4) 학생 기분 전달
    function selectMood(emoji, label, btnElem) {
      selectedMoodData = { emoji, label };
      document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('border-amber-500', 'bg-amber-50'));
      btnElem.classList.add('border-amber-500', 'bg-amber-50');
    }

    function submitMood() {
      const nameInput = document.getElementById('studentName');
      const reasonInput = document.getElementById('moodReason');
      const name = nameInput.value.trim();
      const reason = reasonInput.value.trim();

      if (!selectedMoodData.emoji) return showToast('기분 이모지를 선택해주세요!', 'error');
      if (!name) return showToast('이름을 입력해주세요!', 'error');

      const newItem = {
        name,
        emoji: selectedMoodData.emoji,
        label: selectedMoodData.label,
        reason: reason || '이유 미작성',
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };

      const moodRef = db.ref(`classes/${currentClass}/data/moods`);
      moodRef.once('value', (snapshot) => {
        const currentList = snapshot.val() || [];
        currentList.unshift(newItem);
        moodRef.set(currentList);
      });

      nameInput.value = '';
      reasonInput.value = '';
      showToast('선생님께 마음이 전달되었습니다! 😊');
    }

    function renderMoodList(list) {
      const container = document.getElementById('moodList');
      if (!list || list.length === 0) {
        container.innerHTML = '<p class="text-center py-4 text-slate-400">제출된 학생 기분이 없습니다.</p>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg flex items-start gap-2.5">
          <span class="text-2xl">${item.emoji}</span>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-0.5">
              <span class="font-bold text-slate-800 text-xs">${item.name} (${item.label})</span>
              <span class="text-[10px] text-slate-400">${item.time}</span>
            </div>
            <p class="text-slate-600 truncate text-xs">${item.reason}</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
