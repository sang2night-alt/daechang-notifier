<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대창중학교 스마트 학급 알리미</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- MQTT 웹소켓 클라이언트 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    @keyframes pulse-red {
      0%, 100% { background-color: #ef4444; }
      50% { background-color: #991b1b; }
    }
    .siren-active { animation: pulse-red 0.8s infinite; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header & Navigation Tabs -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 pt-4 pb-2 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-school text-yellow-300 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">대창중학교 스마트 알리미</h1>
      </div>

      <!-- Settings & Connection Status -->
      <div class="flex items-center gap-3 text-sm flex-wrap">
        <div class="bg-indigo-800/80 px-3 py-1.5 rounded-lg flex items-center gap-2 border border-indigo-500/30">
          <span class="text-indigo-200"><i class="fa-solid fa-door-open"></i> 교실 선택:</span>
          <select id="classSelect" onchange="changeClassRoom()" class="bg-indigo-900 text-white rounded px-2 py-1 outline-none text-sm font-semibold">
            <option value="1-1">1학년 1반</option>
            <option value="1-2">1학년 2반</option>
            <option value="1-3" selected>1학년 3반</option>
            <option value="2-1">2학년 1반</option>
            <option value="2-2">2학년 2반</option>
            <option value="3-1">3학년 1반</option>
          </select>
        </div>

        <div id="connectionStatus" class="flex items-center gap-2 bg-slate-800/60 px-3 py-1.5 rounded-lg border border-slate-600">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" id="statusDot"></span>
          <span id="statusText" class="text-xs text-emerald-300 font-semibold">실시간 자동연동 중</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="max-w-6xl mx-auto px-4 flex gap-2 border-t border-indigo-600/50 pt-2 overflow-x-auto">
      <button onclick="switchTab('tab-main')" id="btn-tab-main" class="nav-tab px-4 py-2 text-sm font-bold rounded-t-lg bg-white text-indigo-700 shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-bullhorn"></i> 스마트 알리미
      </button>
      <button onclick="switchTab('tab-meal')" id="btn-tab-meal" class="nav-tab px-4 py-2 text-sm font-bold rounded-t-lg text-indigo-100 hover:bg-indigo-600/50 flex items-center gap-2 transition">
        <i class="fa-solid fa-utensils"></i> 급식 식단
      </button>
      <button onclick="switchTab('tab-mood')" id="btn-tab-mood" class="nav-tab px-4 py-2 text-sm font-bold rounded-t-lg text-indigo-100 hover:bg-indigo-600/50 flex items-center gap-2 transition">
        <i class="fa-solid fa-face-smile"></i> 오늘의 기분
      </button>
      <button onclick="switchTab('tab-teacher')" id="btn-tab-teacher" class="nav-tab px-4 py-2 text-sm font-bold rounded-t-lg text-indigo-100 hover:bg-indigo-600/50 flex items-center gap-2 transition ml-auto">
        <i class="fa-solid fa-user-shield"></i> 교사 대시보드
      </button>
    </nav>
  </header>

  <!-- Main Content Areas -->
  <main class="max-w-6xl mx-auto w-full p-4 md:p-6 flex-1">

    <!-- 1. 스마트 알리미 탭 (메인) -->
    <div id="tab-main" class="tab-content space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column: Timetable & Todo -->
        <div class="md:col-span-2 space-y-6">
          <!-- Timetable -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-clock text-indigo-600"></i> 오늘의 시간표 (1~8교시)
              </h2>
              <button onclick="saveTimetable()" class="teacher-only hidden text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg transition">
                시간표 저장
              </button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center" id="timetableGrid"></div>
          </div>

          <!-- Quick Notice -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-scroll text-amber-500"></i> 오늘 꼭 해야 할 일
            </h2>
            <div class="flex gap-2">
              <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요..." class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
              <button onclick="addTodo()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">추가</button>
            </div>
            <ul id="todoList" class="space-y-2 pt-2"></ul>
          </div>
        </div>

        <!-- Right Column: Praise Thermometer & Quick Mood Sync -->
        <div class="space-y-6">
          <!-- Praise Thermometer -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
              <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-temperature-full text-red-500"></i> 학급 칭찬 온도계
              </h2>
              <span class="text-xl font-extrabold text-red-500" id="tempVal">75°C</span>
            </div>
            <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
              <div id="tempBar" class="bg-gradient-to-r from-amber-400 to-red-500 h-full rounded-full transition-all duration-500" style="width: 75%;"></div>
            </div>
            <div class="flex justify-between gap-2 pt-1">
              <button onclick="updateTemp(-5)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1.5 rounded text-xs transition">-5°C</button>
              <button onclick="updateTemp(5)" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-1.5 rounded text-xs transition">+5°C</button>
            </div>
          </div>

          <!-- Mood Summary -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-heart text-pink-500"></i> 최근 전달된 기분
            </h2>
            <div id="mainMoodSummary" class="space-y-2 text-xs text-slate-500"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- 2. 급식 식단 탭 -->
    <div id="tab-meal" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-2xl mx-auto space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-utensils text-emerald-600"></i> 오늘의 급식 식단 (전교 공통)
          </h2>
          <button onclick="saveMeals()" class="teacher-only hidden text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg transition">
            식단 저장
          </button>
        </div>
        <div id="mealListContainer">
          <ul class="text-base space-y-3 text-slate-700 font-semibold" id="mealList"></ul>
        </div>
      </div>
    </div>

    <!-- 3. 오늘의 기분 탭 (학생 기록용) -->
    <div id="tab-mood" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-2xl mx-auto space-y-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-face-smile text-amber-500"></i> 오늘 나의 기분 기록하기
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <button type="button" onclick="selectMood('😃', '기쁨/상쾌', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-4 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😃</span>
            <span class="text-xs font-semibold text-slate-600">기쁨/상쾌</span>
          </button>
          <button type="button" onclick="selectMood('😐', '평범/보통', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-4 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😐</span>
            <span class="text-xs font-semibold text-slate-600">평범/보통</span>
          </button>
          <button type="button" onclick="selectMood('😴', '피곤/지침', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-4 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😴</span>
            <span class="text-xs font-semibold text-slate-600">피곤/지침</span>
          </button>
          <button type="button" onclick="selectMood('😡', '화남/속상', this)" class="mood-btn border-2 border-slate-200 hover:border-amber-400 p-4 rounded-xl flex flex-col items-center gap-1 transition">
            <span class="text-3xl">😡</span>
            <span class="text-xs font-semibold text-slate-600">화남/속상</span>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <input type="text" id="studentName" placeholder="이름 (예: 홍길동)" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
          <input type="text" id="moodReason" placeholder="이유나 한줄 메모" class="sm:col-span-2 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
        </div>
        <button onclick="submitMood()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl text-sm transition shadow-sm">
          선생님께 전달하기
        </button>
      </div>
    </div>

    <!-- 4. 교사 대시보드 탭 -->
    <div id="tab-teacher" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-indigo-600"></i> 교실 방송 및 실시간 호출
          </h2>
          <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full" id="teacherClassLabel">1학년 3반 제어 중</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <button onclick="sendSignal('CALL', '교무실에서 선생님을 찾습니다!')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-bell text-2xl"></i>
            <span>일반 호출</span>
          </button>
          <button onclick="sendSignal('NOTICE', '전달 사항이 있습니다. 화면을 확인해주세요.')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-bullhorn text-2xl"></i>
            <span>공지 전달</span>
          </button>
          <button onclick="sendSignal('EMERGENCY', '🚨 긴급 상황! 교무실로 즉시 연락 바랍니다!')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            <span>긴급 사이렌</span>
          </button>
        </div>

        <!-- Student Mood Log Board -->
        <div class="border-t pt-4 space-y-3">
          <h3 class="text-md font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-users-viewfinder text-indigo-600"></i> 학생 마음 전달 목록
          </h3>
          <div id="teacherMoodList" class="space-y-2 max-h-60 overflow-y-auto text-xs text-slate-500"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Sound/Alert Confirm Modal -->
  <div id="alertModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl border-4 border-red-500">
      <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-3xl animate-bounce">
        <i class="fa-solid fa-bell"></i>
      </div>
      <h3 id="modalTitle" class="text-xl font-bold text-slate-900">교무실 호출!</h3>
      <p id="modalMsg" class="text-sm text-slate-600 font-semibold">선생님, 교무실에서 전달할 내용이 있습니다.</p>
      <button onclick="stopAlertSound()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">
        확인하였습니다 (알람 끄기)
      </button>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------------
    // 1. MQTT 실시간 클라우드 통신 엔진 초기화
    // ------------------------------------------------------------------------
    const mqttBroker = "wss://broker.emqx.io:8084/mqtt";
    const clientId = "dc_school_" + Math.random().toString(16).substring(2, 8);
    let mqttClient = null;

    let currentClass = "1-3";
    let isTeacherMode = false;
    let selectedMoodData = { emoji: '', label: '' };
    let audioCtx = null;
    let alarmInterval = null;

    // 학급별 기본 시간표 정의
    const defaultTimetables = {
      "1-1": ["국어", "수학", "영어", "과학", "사회", "체육", "미술", "동아리"],
      "1-2": ["수학", "국어", "과학", "영어", "체육", "사회", "음악", "동아리"],
      "1-3": ["국어", "수학", "영어", "과학", "사회", "체육", "미술", "동아리"],
      "2-1": ["영어", "과학", "국어", "수학", "역사", "기술", "한문", "자율"],
      "2-2": ["과학", "영어", "수학", "국어", "기술", "역사", "중국어", "자율"],
      "3-1": ["수학", "영어", "국어", "사회", "과학", "체육", "도덕", "진로"]
    };

    // 전교 공통 기본 급식 메뉴
    const defaultMeals = ["친환경 쌀밥", "얼큰 쇠고기 무국", "수제 돈가스 & 소스", "마카로니 콘샐러드", "배추김치 / 샤인머스캣"];

    // 메모리 내 상태 관리 (학급별 개별 데이터 + 전교 공통 급식)
    let classStore = {};
    let commonMealsData = defaultMeals;

    // ------------------------------------------------------------------------
    // 2. 초기화 및 로컬스토리지 로드
    // ------------------------------------------------------------------------
    window.onload = () => {
      currentClass = localStorage.getItem('dc_selected_class') || '1-3';
      document.getElementById('classSelect').value = currentClass;
      
      loadLocalStorageData();
      updateClassLabel();
      initMqtt();
      refreshUI();
    };

    function loadLocalStorageData() {
      // 1. 공통 급식 식단 로드
      const savedMeals = localStorage.getItem('dc_shared_meals');
      if (savedMeals) {
        try { commonMealsData = JSON.parse(savedMeals); } catch(e) {}
      }

      // 2. 현재 선택 학급 데이터 로드
      const savedClassData = localStorage.getItem(`dc_class_data_${currentClass}`);
      if (savedClassData) {
        try {
          classStore[currentClass] = JSON.parse(savedClassData);
        } catch(e) {}
      }

      // 데이터가 없는 학급이면 기본 구조 초기화
      if (!classStore[currentClass]) {
        classStore[currentClass] = {
          timetable: defaultTimetables[currentClass] || defaultTimetables["1-3"],
          todos: [],
          temperature: 75,
          moods: []
        };
      }
    }

    function getClassData(cId = currentClass) {
      if (!classStore[cId]) {
        classStore[cId] = {
          timetable: defaultTimetables[cId] || defaultTimetables["1-3"],
          todos: [],
          temperature: 75,
          moods: []
        };
      }
      return classStore[cId];
    }

    function saveCurrentClassData() {
      localStorage.setItem(`dc_class_data_${currentClass}`, JSON.stringify(getClassData()));
      publishClassData();
    }

    function saveSharedMealsData() {
      localStorage.setItem('dc_shared_meals', JSON.stringify(commonMealsData));
      publishSharedMealData();
    }

    // ------------------------------------------------------------------------
    // 3. MQTT 실시간 채널 연결 및 토픽 관리 (Retain 메세지 옵션으로 독립 보장)
    // ------------------------------------------------------------------------
    function initMqtt() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      mqttClient = mqtt.connect(mqttBroker, { clientId: clientId, keepalive: 60 });

      mqttClient.on('connect', () => {
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
        statusText.innerText = "실시간 자동연동 완료";
        
        // 1. 전교 공통 급식 채널 구독
        mqttClient.subscribe("daechang/school/common/meals");
        
        // 2. 현재 선택된 학급 전용 채널 구독
        subscribeClassTopics(currentClass);
      });

      mqttClient.on('error', () => {
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
        statusText.innerText = "재연결 시도 중...";
      });

      mqttClient.on('message', (topic, payload) => {
        try {
          const msg = JSON.parse(payload.toString());

          // A. 전교 공통 급식 수신
          if (topic === "daechang/school/common/meals") {
            commonMealsData = msg;
            localStorage.setItem('dc_shared_meals', JSON.stringify(commonMealsData));
            renderMeals();
          }
          // B. 현재 바라보는 학급의 실시간 데이터 수신
          else if (topic === `daechang/school/class/${currentClass}/data`) {
            classStore[currentClass] = msg;
            localStorage.setItem(`dc_class_data_${currentClass}`, JSON.stringify(msg));
            refreshUI();
          }
          // C. 현재 학급 호출 신호 수신
          else if (topic === `daechang/school/class/${currentClass}/signal`) {
            if (msg.timestamp && (Date.now() - msg.timestamp < 10000)) {
              showAlertModal(msg.type, msg.message);
              startAlertSound(msg.type === 'EMERGENCY');
            }
          }
        } catch(e) {}
      });
    }

    function subscribeClassTopics(cId) {
      if (!mqttClient || !mqttClient.connected) return;
      mqttClient.subscribe(`daechang/school/class/${cId}/data`);
      mqttClient.subscribe(`daechang/school/class/${cId}/signal`);
    }

    function unsubscribeClassTopics(cId) {
      if (!mqttClient || !mqttClient.connected) return;
      mqttClient.unsubscribe(`daechang/school/class/${cId}/data`);
      mqttClient.unsubscribe(`daechang/school/class/${cId}/signal`);
    }

    // retain: true 옵션을 적용하여 클라우드가 최신 상태를 기억하고 신규 접속 시 즉시 전송
    function publishClassData() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(
          `daechang/school/class/${currentClass}/data`,
          JSON.stringify(getClassData()),
          { retain: true, qos: 1 }
        );
      }
    }

    function publishSharedMealData() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(
          "daechang/school/common/meals",
          JSON.stringify(commonMealsData),
          { retain: true, qos: 1 }
        );
      }
    }

    function sendSignal(type, message) {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(
          `daechang/school/class/${currentClass}/signal`,
          JSON.stringify({
            type: type,
            message: message,
            timestamp: Date.now()
          }),
          { retain: false, qos: 0 }
        );
      }
      showToast(`${currentClass}반으로 호출 신호를 발송했습니다!`);
    }

    // ------------------------------------------------------------------------
    // 4. 학급 전환 및 UI 새로고침
    // ------------------------------------------------------------------------
    function changeClassRoom() {
      const oldClass = currentClass;
      currentClass = document.getElementById('classSelect').value;
      localStorage.setItem('dc_selected_class', currentClass);
      
      // 구 학급 구독 해제 후 신규 학급 구독
      unsubscribeClassTopics(oldClass);
      loadLocalStorageData();
      subscribeClassTopics(currentClass);
      
      updateClassLabel();
      refreshUI();
      showToast(`${currentClass}반 개별 채널로 전환되었습니다.`);
    }

    function updateClassLabel() {
      document.getElementById('teacherClassLabel').innerText = `${currentClass}반 제어 중`;
    }

    function refreshUI() {
      const data = getClassData();
      renderTimetable(data.timetable);
      renderTodos(data.todos);
      renderPraiseTemp(data.temperature);
      renderMoodList(data.moods);
      renderMeals();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.className = "nav-tab px-4 py-2 text-sm font-bold rounded-t-lg text-indigo-100 hover:bg-indigo-600/50 flex items-center gap-2 transition";
      });

      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (activeBtn) {
        activeBtn.className = "nav-tab px-4 py-2 text-sm font-bold rounded-t-lg bg-white text-indigo-700 shadow-sm flex items-center gap-2";
      }

      if (tabId === 'tab-teacher') {
        setTeacherMode(true);
      }
    }

    function setTeacherMode(enable) {
      isTeacherMode = enable;
      document.querySelectorAll('.teacher-only').forEach(el => {
        if (enable) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
      refreshUI();
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
      toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-sm font-bold transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // ------------------------------------------------------------------------
    // 5. 알람 소리 (확인 버튼 누를 때까지 지속 재생)
    // ------------------------------------------------------------------------
    function startAlertSound(isEmergency) {
      if (alarmInterval) clearInterval(alarmInterval);
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const playBeep = () => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = isEmergency ? 'sawtooth' : 'sine';
          osc.frequency.value = isEmergency ? 880 : 587.33;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {}
      };

      playBeep();
      alarmInterval = setInterval(playBeep, isEmergency ? 500 : 800);
    }

    function stopAlertSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      document.getElementById('alertModal').classList.add('hidden');
    }

    function showAlertModal(type, msg) {
      const modal = document.getElementById('alertModal');
      document.getElementById('modalTitle').innerText = type === 'EMERGENCY' ? '🚨 긴급 사이렌 알림!' : '🔔 교무실 호출 알림';
      document.getElementById('modalMsg').innerText = msg;
      modal.classList.remove('hidden');
    }

    // ------------------------------------------------------------------------
    // 6. 학급별 / 공통 데이터 액션 함수
    // ------------------------------------------------------------------------
    function renderTimetable(list) {
      const grid = document.getElementById('timetableGrid');
      const tt = list || defaultTimetables[currentClass] || defaultTimetables["1-3"];

      grid.innerHTML = tt.map((subject, idx) => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex flex-col justify-center items-center">
          <span class="text-xs font-bold text-slate-400 block mb-1">${idx + 1}교시</span>
          ${isTeacherMode 
            ? `<input type="text" value="${subject}" id="tt-${idx}" class="w-full text-center font-bold text-slate-700 bg-white border border-slate-300 rounded px-1 py-0.5 text-sm outline-none focus:border-indigo-500">`
            : `<span class="font-bold text-slate-700">${subject}</span>`
          }
        </div>
      `).join('');
    }

    function saveTimetable() {
      const updated = [];
      for (let i = 0; i < 8; i++) {
        const input = document.getElementById(`tt-${i}`);
        updated.push(input ? input.value.trim() || '공결' : '공결');
      }
      getClassData().timetable = updated;
      saveCurrentClassData();
      showToast(`${currentClass}반 시간표가 성공적으로 저장되었습니다! ✨`);
    }

    function renderMeals() {
      const container = document.getElementById('mealList');
      const meals = commonMealsData || defaultMeals;

      if (isTeacherMode) {
        container.innerHTML = `
          <textarea id="mealInput" class="w-full h-32 p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:border-emerald-500 font-medium" placeholder="줄바꿈으로 급식 메뉴를 작성하세요.">${meals.join('\n')}</textarea>
        `;
      } else {
        container.innerHTML = meals.map(meal => `
          <li class="flex items-center gap-2"><i class="fa-solid fa-check text-xs text-emerald-500"></i> ${meal}</li>
        `).join('');
      }
    }

    function saveMeals() {
      const textarea = document.getElementById('mealInput');
      if (textarea) {
        const mealsArray = textarea.value.split('\n').map(m => m.trim()).filter(m => m.length > 0);
        commonMealsData = mealsArray;
        saveSharedMealsData();
        showToast("전교 공통 급식 식단이 성공적으로 저장되었습니다! 🍽️");
      }
    }

    function renderPraiseTemp(temp) {
      const t = temp !== undefined ? temp : 75;
      document.getElementById('tempVal').innerText = `${t}°C`;
      document.getElementById('tempBar').style.width = `${t}%`;
    }

    function updateTemp(diff) {
      const data = getClassData();
      let curr = data.temperature !== undefined ? data.temperature : 75;
      curr = Math.max(0, Math.min(100, curr + diff));
      
      data.temperature = curr;
      renderPraiseTemp(curr);
      saveCurrentClassData();
      showToast(`${currentClass}반 칭찬 온도계가 저장되었습니다! 🌡️ (${curr}°C)`);
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      const data = getClassData();
      if (!data.todos) data.todos = [];
      data.todos.push({ text, done: false });
      
      saveCurrentClassData();
      renderTodos(data.todos);
      input.value = '';
    }

    function toggleTodo(idx) {
      const data = getClassData();
      if (data.todos && data.todos[idx]) {
        data.todos[idx].done = !data.todos[idx].done;
        saveCurrentClassData();
        renderTodos(data.todos);
      }
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      if (!todos || todos.length === 0) {
        list.innerHTML = '<li class="text-xs text-slate-400 text-center py-2">등록된 할 일이 없습니다.</li>';
        return;
      }

      list.innerHTML = todos.map((item, idx) => `
        <li onclick="toggleTodo(${idx})" class="flex items-center gap-2 text-sm p-2 rounded-lg bg-slate-50 border border-slate-100 cursor-pointer hover:bg-slate-100">
          <i class="fa-regular ${item.done ? 'fa-square-check text-emerald-500' : 'fa-square text-slate-400'}"></i>
          <span class="${item.done ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${item.text}</span>
        </li>
      `).join('');
    }

    function selectMood(emoji, label, btnElem) {
      selectedMoodData = { emoji, label };
      document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('border-amber-500', 'bg-amber-50'));
      btnElem.classList.add('border-amber-500', 'bg-amber-50');
    }

    function submitMood() {
      const nameInput = document.getElementById('studentName');
      const reasonInput = document.getElementById('moodReason');
      const name = nameInput.value.trim();
      const reason = reasonInput.value.trim();

      if (!selectedMoodData.emoji) return showToast('기분 이모지를 선택해주세요!', 'error');
      if (!name) return showToast('이름을 입력해주세요!', 'error');

      const newItem = {
        name,
        emoji: selectedMoodData.emoji,
        label: selectedMoodData.label,
        reason: reason || '이유 미작성',
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };

      const data = getClassData();
      if (!data.moods) data.moods = [];
      data.moods.unshift(newItem);

      saveCurrentClassData();
      renderMoodList(data.moods);

      nameInput.value = '';
      reasonInput.value = '';
      showToast(`${currentClass}반 선생님께 마음이 전달되었습니다! 😊`);
    }

    function renderMoodList(list) {
      const mainSummary = document.getElementById('mainMoodSummary');
      const teacherList = document.getElementById('teacherMoodList');

      if (!list || list.length === 0) {
        const emptyMsg = '<p class="text-center py-4 text-slate-400">제출된 마음 전달이 없습니다.</p>';
        mainSummary.innerHTML = emptyMsg;
        teacherList.innerHTML = emptyMsg;
        return;
      }

      const html = list.map(item => `
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg flex items-start gap-2.5">
          <span class="text-2xl">${item.emoji}</span>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-0.5">
              <span class="font-bold text-slate-800 text-xs">${item.name} (${item.label})</span>
              <span class="text-[10px] text-slate-400">${item.time}</span>
            </div>
            <p class="text-slate-600 truncate text-xs">${item.reason}</p>
          </div>
        </div>
      `).join('');

      mainSummary.innerHTML = html;
      teacherList.innerHTML = html;
    }
  </script>
</body>
</html>
